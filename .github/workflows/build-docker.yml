name: Reusable Docker build and push workflow

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      app_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      push:
        required: true
        type: boolean

jobs:
  docker-build:
    runs-on: ubuntu-latest
    # Pull request runs (including forks) never use the production environment or Azure credentials.
    environment: ${{ github.event_name != 'pull_request' && 'production' || '' }}
    steps:

    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Login to Azure
      if: ${{ inputs.push && github.event_name != 'pull_request' }}
      uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Login to ACR
      if: ${{ inputs.push && github.event_name != 'pull_request' }}
      run: az acr login --name ${{ inputs.registry }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Determine Tag Name Based on Branch
      id: determine_tag
      run: |
        if [[ "${{ github.ref_name }}" == "main" ]]; then
          echo "tagname=latest" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_name }}" == "dev" ]]; then
          echo "tagname=dev" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_name }}" == "demo" ]]; then
          echo "tagname=demo" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_name }}" == "hotfix" ]]; then
          echo "tagname=hotfix" >> $GITHUB_OUTPUT
        else
          echo "tagname=default" >> $GITHUB_OUTPUT
        fi


    - name: Build Docker Image and optionally push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        cache-from: type=registry,ref=${{ inputs.registry }}/${{ inputs.app_name}}:${{ steps.determine_tag.outputs.tagname }}
        tags: |
          ${{ inputs.registry }}/${{ inputs.app_name}}:${{ steps.determine_tag.outputs.tagname }}
          ${{ inputs.registry }}/${{ inputs.app_name}}:${{ steps.determine_tag.outputs.tagname }}_${{ steps.date.outputs.date }}_${{ github.run_number }}